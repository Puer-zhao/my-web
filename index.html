<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙头街招商引资资源管理平台 v1.7</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Draw JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <!-- Turf.js 用于可靠的地理面积计算 -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

    <style>
        :root {
            --primary: #1a5276;
            --primary-light: #2980b9;
            --primary-lighter: #d4e6f1;
            --accent: #c0392b;
            --accent-light: #e74c3c;
            --success: #27ae60;
            --success-light: #d5f5e3;
            --warning: #f39c12;
            --warning-light: #fef5e7;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-secondary: #5d6d7e;
            --border: #dce1e8;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s;
            --font: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; }

        .header { background:linear-gradient(135deg,#1a3c5e 0%,#1a5276 40%,#1f6f8b 100%); color:#fff; padding:0 28px; display:flex; align-items:center; justify-content:space-between; height:60px; box-shadow:0 2px 16px rgba(0,0,0,0.18); position:sticky; top:0; z-index:1000; }
        .header-left { display:flex; align-items:center; gap:14px; }
        .header-logo { width:40px; height:40px; background:rgba(255,255,255,0.18); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; }
        .header-title { font-size:19px; font-weight:700; }
        .header-subtitle { font-size:12px; opacity:0.85; }
        .header-right { display:flex; align-items:center; gap:10px; font-size:13px; opacity:0.9; }
        .header-dot { width:8px; height:8px; background:#5ddea8; border-radius:50%; animation:pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%,100%{ box-shadow:0 0 0 0 rgba(93,222,168,0.6); } 50%{ box-shadow:0 0 0 10px rgba(93,222,168,0); } }

        .tab-nav { display:flex; gap:0; background:#fff; margin:16px 20px 0; border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--border); }
        .tab-btn { flex:1; padding:14px 20px; border:none; background:#fff; cursor:pointer; font-size:14px; font-weight:600; color:var(--text-secondary); transition:var(--transition); font-family:var(--font); display:flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; }
        .tab-btn:hover { background:#f8fafb; color:var(--primary); }
        .tab-btn.active { background:var(--primary); color:#fff; }

        .main-container { padding:16px 20px 20px; max-width:1500px; margin:0 auto; }
        .tab-content { display:none; animation:fadeSlideIn 0.35s ease; }
        .tab-content.active { display:block; }
        @keyframes fadeSlideIn { from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }

        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:16px; margin-bottom:20px; }
        .stat-card { background:var(--card-bg); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); border:1px solid var(--border); transition:var(--transition); position:relative; overflow:hidden; }
        .stat-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
        .stat-card .stat-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:10px; }
        .stat-card .stat-value { font-size:32px; font-weight:700; }
        .stat-card .stat-label { font-size:13px; color:var(--text-secondary); }
        .stat-accent { position:absolute; top:-20px; right:-20px; width:80px; height:80px; border-radius:50%; opacity:0.06; background:var(--primary); }
        .icon-blue { background:#d4e6f1; color:#1a5276; } .icon-green { background:#d5f5e3; color:#1e8449; } .icon-orange { background:#fef5e7; color:#b9770e; } .icon-purple { background:#e8daef; color:#6c3483; } .icon-teal { background:#d1f2eb; color:#0e6655; }

        .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
        @media (max-width:900px) { .charts-row { grid-template-columns:1fr; } }
        .chart-card { background:var(--card-bg); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); border:1px solid var(--border); }
        .chart-card h3 { font-size:15px; font-weight:700; margin-bottom:14px; }
        .chart-wrap { position:relative; height:260px; } .chart-wrap canvas { max-height:260px; }

        .table-card { background:var(--card-bg); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden; }
        .table-card h3 { font-size:15px; font-weight:700; margin-bottom:14px; }
        .table-wrap { overflow-x:auto; max-height:420px; overflow-y:auto; border-radius:var(--radius-sm); border:1px solid var(--border); }
        table { width:100%; border-collapse:collapse; font-size:13px; min-width:1000px; }
        table thead th { background:#f4f6f9; color:var(--text); font-weight:700; padding:12px 14px; text-align:left; border-bottom:2px solid #dce1e8; white-space:nowrap; font-size:12px; position:sticky; top:0; z-index:2; }
        table tbody td { padding:11px 14px; border-bottom:1px solid #eef1f5; white-space:nowrap; }
        table tbody tr:hover { background:#f8fafc; }
        .badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; }
        .badge-available { background:#fef5e7; color:#b9770e; } .badge-rented { background:#d5f5e3; color:#1e8449; } .badge-partial { background:#d4e6f1; color:#1a5276; } .badge-construction { background:#eaecee; color:#5d6d7e; }
        .btn-sm { padding:5px 10px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:11px; font-weight:600; transition:var(--transition); font-family:var(--font); color:var(--primary); display:inline-flex; align-items:center; gap:3px; white-space:nowrap; }
        .btn-sm:hover { background:var(--primary-lighter); border-color:var(--primary-light); }
        .btn-sm.danger { color:var(--accent); } .btn-sm.danger:hover { background:#fadbd8; border-color:var(--accent-light); }
        .btn-sm.view { color:#1a5276; border-color:#a2c4dd; } .btn-sm.view:hover { background:#d4e6f1; }
        .btn-sm.primary-fill { background:var(--primary); color:#fff; border-color:var(--primary); }
        .btn-sm.primary-fill:hover { background:#14405e; border-color:#14405e; }
        .btn-sm.accent-fill { background:var(--accent); color:#fff; border-color:var(--accent); }
        .btn-sm.accent-fill:hover { background:#922b21; border-color:#922b21; }

        .map-page-layout { display:flex; gap:16px; height:calc(100vh - 180px); min-height:600px; }
        @media (max-width:900px) { .map-page-layout { flex-direction:column; height:auto; } .map-sidebar { max-height:350px; width:100%!important; } .map-area { height:500px!important; } }
        .map-sidebar { width:350px; min-width:300px; background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
        .map-sidebar-header { padding:14px 16px; border-bottom:1px solid var(--border); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:space-between; background:#fafbfc; gap:8px; flex-wrap:wrap; }
        .count-badge { background:var(--primary); color:#fff; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; flex-shrink:0; }
        .map-sidebar-search { padding:10px 14px; border-bottom:1px solid var(--border); }
        .map-sidebar-search input { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:20px; font-size:13px; font-family:var(--font); outline:none; }
        .map-sidebar-list { flex:1; overflow-y:auto; padding:6px 10px; min-height:0; }
        .map-sidebar-list .building-item, .map-sidebar-list .plot-item { padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; transition:var(--transition); border:1px solid transparent; margin-bottom:4px; display:flex; align-items:center; gap:10px; font-size:13px; }
        .map-sidebar-list .building-item:hover, .map-sidebar-list .plot-item:hover { background:#f4f7fa; border-color:#dce1e8; }
        .map-sidebar-list .building-item.active, .map-sidebar-list .plot-item.active { background:var(--primary-lighter); border-color:var(--primary-light); font-weight:600; }
        .type-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .item-info { flex:1; min-width:0; } .item-name { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .item-addr { font-size:11px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .item-area { font-size:11px; font-weight:600; color:var(--primary); flex-shrink:0; }
        .item-delete { margin-left:auto; cursor:pointer; color:#c0392b; font-size:14px; opacity:0.7; transition:0.2s; flex-shrink:0; }
        .item-delete:hover { opacity:1; transform:scale(1.1); }
        .map-area { flex:1; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); position:relative; overflow:hidden; background:#e8e8e8; min-height:500px; }
        #map, #map2 { width:100%; height:100%; border-radius:var(--radius); }

        .map-layer-switch { background:white; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,0.15); display:flex; overflow:hidden; border:1px solid #dce1e8; pointer-events:auto; }
        .map-layer-switch button { padding:8px 16px; border:none; background:white; cursor:pointer; font-size:13px; font-weight:600; font-family:inherit; transition:0.2s; color:#2c3e50; }
        .map-layer-switch button.active { background:#1a5276; color:white; }
        .map-layer-switch button:hover { background:#f0f2f5; } .map-layer-switch button.active:hover { background:#14405e; }

        .map-legend { position:absolute; bottom:20px; right:20px; background:#fff; border-radius:var(--radius-sm); padding:12px 14px; box-shadow:var(--shadow-lg); z-index:1000; font-size:11px; border:1px solid var(--border); pointer-events:auto; }
        .map-legend h4 { font-size:12px; margin-bottom:8px; font-weight:700; }
        .map-legend .legend-item { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
        .legend-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; border:2px solid rgba(0,0,0,0.15); }

        .draw-toolbar-custom { padding:10px 14px; border-top:1px solid var(--border); background:#fafbfc; display:flex; flex-wrap:wrap; gap:8px; }
        .draw-toolbar-custom .draw-tool-label { font-size:11px; color:var(--text-secondary); width:100%; margin-bottom:2px; font-weight:600; text-transform:uppercase; }
        .draw-tool-btn { padding:8px 14px; border-radius:20px; border:2px dashed #a2c4dd; background:#fff; cursor:pointer; font-size:12px; font-weight:600; font-family:var(--font); transition:var(--transition); color:var(--primary); display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
        .draw-tool-btn:hover { background:#d4e6f1; border-color:var(--primary-light); border-style:solid; }
        .draw-tool-btn.active-tool { background:var(--primary); color:#fff; border-color:var(--primary); border-style:solid; animation:glow-pulse 1.5s infinite; }
        @keyframes glow-pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(26,82,118,0.4); } 50%{ box-shadow:0 0 0 12px rgba(26,82,118,0); } }

        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; display:flex; align-items:center; justify-content:center; }
        .modal { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-lg); width:520px; max-width:94vw; max-height:85vh; overflow-y:auto; }
        .modal-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; font-weight:700; background:#fafbfc; position:sticky; top:0; z-index:1; }
        .modal-close { width:32px; height:32px; border-radius:50%; border:none; background:#eaecee; cursor:pointer; font-size:16px; }
        .modal-body { padding:20px; }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-weight:600; font-size:12px; margin-bottom:5px; color:var(--text-secondary); text-transform:uppercase; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:var(--font); outline:none; background:#fafbfc; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media (max-width:500px) { .form-row { grid-template-columns:1fr; } }
        .modal-footer { padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; background:#fafbfc; position:sticky; bottom:0; }
        .btn { padding:10px 20px; border-radius:var(--radius-sm); font-weight:600; cursor:pointer; font-size:13px; font-family:var(--font); border:1px solid transparent; transition:var(--transition); }
        .btn-primary { background:var(--primary); color:#fff; } .btn-outline { background:#fff; color:var(--text); border-color:var(--border); } .btn-danger { background:#fff; color:var(--accent); border-color:#f5b7b1; }
        .toast { position:fixed; top:20px; right:20px; z-index:9999; background:#27ae60; color:#fff; padding:12px 20px; border-radius:8px; font-weight:600; box-shadow:var(--shadow-lg); animation:slideInRight 0.3s ease; pointer-events:none; }
        @keyframes slideInRight { from{ transform:translateX(120%); opacity:0; } to{ transform:translateX(0); opacity:1; } }
        .key-notice { background:#fffbe6; border:1px solid #f0d87e; border-radius:var(--radius-sm); padding:10px 16px; font-size:12px; color:#7d6608; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
        .key-notice button { margin-left:auto; background:none; border:none; cursor:pointer; font-size:14px; color:#7d6608; font-weight:bold; }
        .empty-state { text-align:center; padding:30px 20px; color:#999; font-size:13px; }

        .leaflet-draw-toolbar { box-shadow:0 2px 8px rgba(0,0,0,0.2)!important; border-radius:6px!important; }
        .leaflet-draw-toolbar a { width:34px!important; height:34px!important; line-height:34px!important; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <div class="header-logo">🏢</div>
        <div>
            <div class="header-title">沙头街招商引资资源管理平台</div>
            <div class="header-subtitle">广州市番禺区沙头街道办事处 · v1.7</div>
        </div>
    </div>
    <div class="header-right"><div class="header-dot"></div> 数据实时更新</div>
</div>

<div class="tab-nav">
    <button class="tab-btn active" data-tab="tab-dashboard">📊 数据汇总</button>
    <button class="tab-btn" data-tab="tab-map">🏢 存量物业</button>
    <button class="tab-btn" data-tab="tab-plot">📐 招商地块</button>
</div>

<div class="main-container">
    <div class="tab-content active" id="tab-dashboard">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="charts-row">
            <div class="chart-card"><h3>📈 各类型物业面积分布（㎡）</h3><div class="chart-wrap"><canvas id="chartType"></canvas></div></div>
            <div class="chart-card"><h3>🏘️ 各村/社区物业数量</h3><div class="chart-wrap"><canvas id="chartVillage"></canvas></div></div>
        </div>
        <div class="table-card">
            <h3>📋 招商资源明细表 <span style="font-weight:400;font-size:12px;color:#999;">（最新添加置顶，点击行可定位）</span></h3>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>序号</th><th>建筑名称</th><th>所属村/社区</th><th>地址</th><th>物业类型</th><th>可出租面积(㎡)</th><th>租金(元/㎡/月)</th><th>状态</th><th>联系人</th><th>操作</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="tab-content" id="tab-map">
        <div class="key-notice" id="keyNoticeMap" style="display:none;">⚠️ 请配置天地图Key，当前使用OSM备用底图。<button onclick="this.parentElement.style.display='none'">✕</button></div>
        <div class="map-page-layout">
            <div class="map-sidebar">
                <div class="map-sidebar-header">🏢 建筑列表 <span class="count-badge" id="buildingCount">0</span><button class="btn-sm primary-fill" onclick="addNewBuilding()">+ 新增建筑</button></div>
                <div class="map-sidebar-search"><input type="text" id="searchBuildingInput" placeholder="🔍 搜索建筑..." oninput="filterBuildingList()"></div>
                <div class="map-sidebar-list" id="buildingList"></div>
            </div>
            <div class="map-area"><div id="map"></div>
                <div class="map-legend"><h4>📌 图例</h4><div class="legend-item"><span class="legend-dot" style="background:#f39c12;"></span>待出租</div><div class="legend-item"><span class="legend-dot" style="background:#27ae60;"></span>已出租</div><div class="legend-item"><span class="legend-dot" style="background:#2980b9;"></span>部分可租</div><div class="legend-item"><span class="legend-dot" style="background:#95a5a6;"></span>在建/装修</div></div>
            </div>
        </div>
    </div>

    <div class="tab-content" id="tab-plot">
        <div class="key-notice" id="keyNoticePlot" style="display:none;">⚠️ 请配置天地图Key，当前使用OSM备用底图。<button onclick="this.parentElement.style.display='none'">✕</button></div>
        <div class="map-page-layout">
            <div class="map-sidebar">
                <div class="map-sidebar-header">📐 地块列表 <span class="count-badge" id="plotCount">0</span></div>
                <div class="map-sidebar-search"><input type="text" id="searchPlotInput" placeholder="🔍 搜索地块..." oninput="filterPlotList()"></div>
                <div class="map-sidebar-list" id="plotList"></div>
                <div class="draw-toolbar-custom" id="drawToolbarCustom">
                    <div class="draw-tool-label">🖌️ 绘图工具</div>
                    <button class="draw-tool-btn" id="btnDrawPolygon" onclick="activateDrawPolygon()" title="点击地图绘制多边形地块">✏️ 绘制多边形地块</button>
                    <button class="draw-tool-btn" id="btnDrawRectangle" onclick="activateDrawRectangle()" title="点击地图绘制矩形地块">📐 绘制矩形地块</button>
                    <button class="draw-tool-btn danger" id="btnCancelDraw" onclick="cancelDrawing()" style="display:none;border-color:#f5b7b1;color:#c0392b;">❌ 取消绘制</button>
                    <button class="draw-tool-btn" id="btnClearAllPlots" onclick="clearAllPlots()" style="border-color:#e0e0e0;color:#888;">🗑️ 清空所有地块</button>
                </div>
            </div>
            <div class="map-area"><div id="map2"></div>
                <div class="map-legend"><h4>📌 图例</h4><div class="legend-item"><span class="legend-dot" style="background:#f39c12;"></span>待出租地块</div><div class="legend-item"><span class="legend-dot" style="background:#27ae60;"></span>已出租地块</div><div class="legend-item"><span class="legend-dot" style="background:#2980b9;"></span>部分可租地块</div><div class="legend-item"><span class="legend-dot" style="background:#95a5a6;"></span>在建地块</div></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
        <div class="modal-header"><span id="modalTitle">编辑</span><button class="modal-close" onclick="closeModal()">✕</button></div>
        <div class="modal-body" id="modalBody">
            <input type="hidden" id="editId"><input type="hidden" id="editTypeFlag" value="building">
            <div class="form-group"><label>名称 *</label><input type="text" id="editName" placeholder="建筑或地块名称"></div>
            <div class="form-row">
                <div class="form-group"><label>所属村/社区 *</label><select id="editVillage"></select></div>
                <div class="form-group"><label>物业类型 *</label><select id="editType"><option value="厂房/工业园">厂房/工业园</option><option value="商铺">商铺</option><option value="办公楼">办公楼</option><option value="仓库">仓库</option><option value="综合楼宇">综合楼宇</option><option value="商业综合体">商业综合体</option><option value="地块">地块</option><option value="其他">其他</option></select></div>
            </div>
            <div class="form-group"><label>详细地址 *</label><input type="text" id="editAddress" placeholder="地址"></div>
            <div class="form-row">
                <div class="form-group"><label>可出租面积（㎡） *</label><input type="number" id="editArea" step="0.01" value="0"></div>
                <div class="form-group"><label>租金（元/㎡/月） *</label><input type="number" id="editRent" step="0.5" value="0"></div>

        async function loadData() {
    // 1. 读取建筑数据
    const { data: savedB, error: errB } = await supabase
        .from('buildings').select('*').order('created_at', { ascending: false });
    if (errB) {
        console.error('读取建筑数据失败', errB);
        buildings = JSON.parse(JSON.stringify(DEFAULT_BUILDINGS));
    } else if (savedB && savedB.length > 0) {
        buildings = savedB;
    } else {
        buildings = JSON.parse(JSON.stringify(DEFAULT_BUILDINGS));
        const { error: insertErr } = await supabase.from('buildings').insert(buildings);
        if (insertErr) console.error('写入默认数据失败', insertErr);
    }
    buildings.forEach(b => { if (!b.createdAt) b.createdAt = '2024-01-01'; });

    // 2. 读取地块数据
    const { data: savedP, error: errP } = await supabase
        .from('plots').select('*').order('created_at', { ascending: false });
    if (errP) {
        console.error('读取地块数据失败', errP);
        plots = [];
    } else if (savedP && savedP.length > 0) {
        plots = savedP;
    } else {
        plots = [];
    }
    plots.forEach(p => { if (!p.createdAt) p.createdAt = '2024-01-01'; });

    // 3. 启动实时订阅
    startRealtimeSubscription();

    // 4. 渲染界面
    renderDashboard();
}

async function saveBuildingToDB(data) {
    if (data.id) {
        const { error } = await supabase
            .from('buildings').update(data).eq('id', data.id);
        if (error) showToast('更新建筑失败: ' + error.message);
        return !error;
    } else {
        data.created_at = new Date().toISOString();
        const { error } = await supabase.from('buildings').insert(data);
        if (error) showToast('添加建筑失败: ' + error.message);
        return !error;
    }
}

async function deleteBuildingFromDB(id) {
    const { error } = await supabase.from('buildings').delete().eq('id', id);
    return !error;
}

async function savePlotToDB(data) {

        data.created_at = new Date().toISOString();

        function getStats() {
            const total = buildings.length;
            const totalArea = buildings.reduce((s,b)=>s+(parseFloat(b.area)||0),0);
            const availableArea = buildings.filter(b=>b.status==='待出租'||b.status==='部分可租').reduce((s,b)=>s+((b.status==='部分可租'?0.5:1)*(parseFloat(b.area)||0)),0);
            const availableCount = buildings.filter(b=>b.status==='待出租'||b.status==='部分可租').length;
            const rentedCount = buildings.filter(b=>b.status==='已出租').length;
            const constructionCount = buildings.filter(b=>b.status==='在建/装修').length;
            const avgRent = buildings.filter(b=>parseFloat(b.rent)>0).reduce((s,b,_,arr)=>s+parseFloat(b.rent)/arr.length,0);
            return { total, totalArea, availableArea, availableCount, rentedCount, constructionCount, avgRent };
        }

            return map;

        function setupTiandituLayers(map) {
            if (!TIANDITU_KEY) return null;
            const vec = L.tileLayer(`http://t{s}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_KEY}`, { subdomains:['0','1','2','3','4','5','6','7'], maxZoom:18, attribution:'天地图矢量' });
            const cva = L.tileLayer(`http://t{s}.tianditu.gov.cn/cva_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cva&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_KEY}`, { subdomains:['0','1','2','3','4','5','6','7'], maxZoom:18 });
            const img = L.tileLayer(`http://t{s}.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_KEY}`, { subdomains:['0','1','2','3','4','5','6','7'], maxZoom:18, attribution:'天地图影像' });
            const cia = L.tileLayer(`http://t{s}.tianditu.gov.cn/cia_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cia&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_KEY}`, { subdomains:['0','1','2','3','4','5','6','7'], maxZoom:18 });
            const vecGroup = L.layerGroup([vec, cva]);
            const imgGroup = L.layerGroup([img, cia]);
            vecGroup.addTo(map);
            const switchControl = L.control({ position:'topright' });
            switchControl.onAdd = function() {
                const div = L.DomUtil.create('div','map-layer-switch');
                L.DomEvent.disableClickPropagation(div);
                const btnVec = L.DomUtil.create('button','',div); btnVec.innerHTML='🗺️ 矢量'; btnVec.classList.add('active');
                const btnImg = L.DomUtil.create('button','',div); btnImg.innerHTML='🛰️ 影像';
                L.DomEvent.on(btnVec,'click', ()=>{ map.removeLayer(imgGroup); map.addLayer(vecGroup); btnVec.classList.add('active'); btnImg.classList.remove('active'); });
                L.DomEvent.on(btnImg,'click', ()=>{ map.removeLayer(vecGroup); map.addLayer(imgGroup); btnImg.classList.add('active'); btnVec.classList.remove('active'); });
                return div;
            };
            switchControl.addTo(map);
            return { vecGroup, imgGroup };
        }

            });
            map2.addControl(drawControl);

                const layer = e.layer;
                let coords = [];

                if (e.layerType === 'polygon' || e.layerType === 'rectangle') {
                    const latlngs = layer.getLatLngs()[0];
                    coords = latlngs.map(ll => [ll.lat, ll.lng]);
                    try {
                        const polygon = turf.polygon([coords.concat([[coords[0][0], coords[0][1]]])]);
                        area = turf.area(polygon);
                    } catch (err) { console.warn('Turf面积计算失败', err); }
                }
                tempDrawnLayer = layer;
                drawnItemsGroup.addLayer(layer);
                resetDrawToolButtons();
                openPlotModalForNew(coords, area, layer);
            });
            map2.on(L.Draw.Event.DRAWSTART, function(e) {
                if (tempDrawnLayer && drawnItemsGroup.hasLayer(tempDrawnLayer)) {
                    drawnItemsGroup.removeLayer(tempDrawnLayer);

        function refreshPlotLayers() {

                const polygon = L.polygon(p.coordinates, { color: statusColor, weight: 3, fillOpacity: 0.25, fillColor: statusColor }).addTo(map2);
                polygon._plotId = p.id;
                polygon.bindPopup(createPlotPopup(p));
                polygon.on('click', ()=>highlightPlotInList(p.id));
                plotLayers[p.id] = polygon;
            });
            document.getElementById('plotCount').textContent = plots.length;
            filterPlotList();
        }
        function createPlotPopup(p) {
            return `<div style="padding:10px;min-width:200px;"><h4>${escHtml(p.name)}</h4><p>📍 ${escHtml(p.address)}</p><p>📐 ${(parseFloat(p.area)||0).toLocaleString()}㎡ | 💰 ${parseFloat(p.rent)>0?p.rent+'元/㎡/月':'面议'}</p><p>状态：${p.status}</p><p style="text-align:right;"><button class="btn-sm view" onclick="editPlot(${p.id})" style="font-size:11px;">✏️ 编辑</button></p></div>`;
        }
        function filterPlotList() {
            const q = document.getElementById('searchPlotInput').value.toLowerCase();
            const filtered = plots.filter(p=>(p.name+p.address).toLowerCase().includes(q));
            document.getElementById('plotList').innerHTML = filtered.map(p=>`
                <div class="plot-item" data-id="${p.id}" onclick="flyToPlot(${p.id})">
                    <span class="type-dot" style="background:#1a5276"></span>
                    <div class="item-info"><div class="item-name">${escHtml(p.name)}</div><div class="item-addr">${escHtml(p.address)}</div></div>
                    <div class="item-area">${(parseFloat(p.area)||0).toLocaleString()}㎡</div>
                    <span class="item-delete" onclick="event.stopPropagation();deletePlotById(${p.id})" title="删除地块">🗑️</span>
                </div>`).join('') || '<div class="empty-state">暂无地块，请使用下方绘图工具在地图上绘制</div>';
        }
        function flyToPlot(id) { const p = plots.find(x=>x.id===id); if(p && map2 && p.coordinates) { map2.flyToBounds(p.coordinates); plotLayers[id]?.openPopup(); highlightPlotInList(id); } }
        function highlightPlotInList(id) {
            document.querySelectorAll('#plotList .plot-item').forEach(el=>el.classList.remove('active'));
            document.querySelector(`#plotList .plot-item[data-id="${id}"]`)?.classList.add('active');
        }
        async function deletePlotById(id) {
            if (!confirm('确定删除该地块？')) return;
            if (plotLayers[id] && map2.hasLayer(plotLayers[id])) map2.removeLayer(plotLayers[id]);
            plots = plots.filter(p=>p.id!==id);
            await deletePlotFromDB(id);
            refreshPlotLayers();
            showToast('已删除地块');
        }

        function activateDrawPolygon() {
            if (!map2) { switchTab('tab-plot'); return; }
            clearTempDrawnLayer();
            activeDrawTool = 'polygon';
            updateDrawToolButtons();
            try { new L.Draw.Polygon(map2, drawControl.options.draw.polygon).enable(); } catch(e) { showToast('绘图启动失败'); activeDrawTool=null; updateDrawToolButtons(); }
        }
        function activateDrawRectangle() {
            if (!map2) { switchTab('tab-plot'); return; }
            clearTempDrawnLayer();
            activeDrawTool = 'rectangle';
            updateDrawToolButtons();
            try { new L.Draw.Rectangle(map2, drawControl.options.draw.rectangle).enable(); } catch(e) { showToast('绘图启动失败'); activeDrawTool=null; updateDrawToolButtons(); }
        }
        function cancelDrawing() { clearTempDrawnLayer(); activeDrawTool=null; updateDrawToolButtons(); map2?.fire('keydown', { keyCode:27 }); showToast('已取消绘制'); }
        function clearTempDrawnLayer() {
            if (tempDrawnLayer && drawnItemsGroup?.hasLayer(tempDrawnLayer)) drawnItemsGroup.removeLayer(tempDrawnLayer);
            tempDrawnLayer = null;
            pendingPlotData = null;
        }
        async function clearAllPlots() {
    if (!confirm('确定清空所有地块？不可恢复！')) return;
    Object.values(plotLayers).forEach(l=>{ if(map2?.hasLayer(l)) map2.removeLayer(l); });
    plotLayers={}; drawnItemsGroup?.clearLayers(); tempDrawnLayer=null; pendingPlotData=null;
    // 逐个从 Supabase 删除
    for (const p of plots) {
        await deletePlotFromDB(p.id);
    }
    plots=[]; 
    refreshPlotLayers(); 
    showToast('已清空所有地块');
}
        function updateDrawToolButtons() {
            document.getElementById('btnDrawPolygon')?.classList.toggle('active-tool', activeDrawTool==='polygon');
            document.getElementById('btnDrawRectangle')?.classList.toggle('active-tool', activeDrawTool==='rectangle');
            document.getElementById('btnCancelDraw').style.display = activeDrawTool ? 'inline-flex' : 'none';
        }
        function resetDrawToolButtons() { activeDrawTool=null; updateDrawToolButtons(); }

        function setFormDisabled(disabled) {
            document.querySelectorAll('#modalBody input, #modalBody select, #modalBody textarea').forEach(el=> el.disabled = disabled);
            document.getElementById('btnSave').style.display = disabled ? 'none' : 'inline-flex';
            document.getElementById('btnDelete').style.display = disabled ? 'none' : (currentEditId ? 'inline-flex' : 'none');
            document.getElementById('btnClose').textContent = disabled ? '关闭' : '取消';
            isViewOnly = disabled;
        }
        function openBuildingModal(id, lat, lng, viewOnly) {
            currentEditType = 'building'; currentEditId = id || null;
            document.getElementById('editTypeFlag').value = 'building';
            document.getElementById('modalTitle').textContent = viewOnly ? '查看建筑详情' : (id ? '编辑建筑物信息' : '新增建筑物信息');
            const b = id ? buildings.find(x=>x.id===id) : null;
            document.getElementById('editId').value = id || '';
            document.getElementById('editName').value = b ? b.name : '';
            document.getElementById('editAddress').value = b ? b.address : '';
            document.getElementById('editArea').value = b ? b.area : '';
            document.getElementById('editRent').value = b ? b.rent : '';
            document.getElementById('editStatus').value = b ? b.status : '待出租';
            document.getElementById('editContact').value = b ? b.contact : '';
            document.getElementById('editPhone').value = b ? b.phone : '';
            document.getElementById('editNote').value = b ? b.note : '';
            document.getElementById('editLat').value = b ? b.lat : (lat ? lat.toFixed(6) : '');
            document.getElementById('editLng').value = b ? b.lng : (lng ? lng.toFixed(6) : '');
            document.getElementById('editVillage').value = b ? b.village : '';
            document.getElementById('editType').value = b ? b.type : '厂房/工业园';
            document.getElementById('coordFields').style.display = 'block';
            document.getElementById('polygonAreaDisplay').style.display = 'none';
            document.getElementById('btnDelete').style.display = id && !viewOnly ? 'inline-flex' : 'none';
            setFormDisabled(!!viewOnly);
            document.getElementById('modalOverlay').style.display = 'flex';
        }
        function viewBuilding(id) { openBuildingModal(id, null, null, true); }
        function editBuilding(id) { openBuildingModal(id, null, null, false); }
        function addNewBuilding() { const lat = 22.942 + (Math.random()-0.5)*0.01; const lng = 113.347 + (Math.random()-0.5)*0.02; openBuildingModal(null, lat, lng, false); }
        async function deleteBuildingById(id) {
            if (!confirm('确定删除该建筑？')) return;
            buildings = buildings.filter(b=>b.id!==id);
            await deleteBuildingFromDB(id);
            refreshBuildingMarkers();
            renderDashboard();
            showToast('已删除');
        }
        function openPlotModalForNew(coords, area, layer) {
            currentEditType = 'plot'; currentEditId = null;
            document.getElementById('editTypeFlag').value = 'plot';
            document.getElementById('modalTitle').textContent = '新增地块 - 请填写地块信息';
            document.getElementById('editId').value = '';
            document.getElementById('editName').value = '';
            document.getElementById('editAddress').value = '';
            document.getElementById('editArea').value = area > 0 ? area.toFixed(2) : '0';
            document.getElementById('editRent').value = '0';
            document.getElementById('editStatus').value = '待出租';
            document.getElementById('editContact').value = '';
            document.getElementById('editPhone').value = '';
            document.getElementById('editNote').value = '';
            document.getElementById('editVillage').value = '';
            document.getElementById('editType').value = '地块';
            document.getElementById('coordFields').style.display = 'none';
            document.getElementById('polygonAreaDisplay').style.display = 'block';
            document.getElementById('polygonAreaDisplay').textContent = area > 0 ? `📐 系统计算面积：${area.toFixed(2)} ㎡（约 ${(area/666.67).toFixed(2)} 亩）` : '📐 面积计算中...';
            document.getElementById('btnDelete').style.display = 'none';
            setFormDisabled(false);
            document.getElementById('modalOverlay').style.display = 'flex';
            pendingPlotData = { coords, area, layer };
        }
        function editPlot(id) {
            const p = plots.find(x=>x.id===id); if (!p) return;
            currentEditType = 'plot'; currentEditId = id; pendingPlotData = null;
            document.getElementById('editTypeFlag').value = 'plot';
            document.getElementById('modalTitle').textContent = '编辑地块信息';
            document.getElementById('editId').value = p.id;
            document.getElementById('editName').value = p.name || '';
            document.getElementById('editAddress').value = p.address || '';
            document.getElementById('editArea').value = p.area || 0;
            document.getElementById('editRent').value = p.rent || 0;
            document.getElementById('editStatus').value = p.status || '待出租';
            document.getElementById('editContact').value = p.contact || '';
            document.getElementById('editPhone').value = p.phone || '';
            document.getElementById('editNote').value = p.note || '';
            document.getElementById('editVillage').value = p.village || '';
            document.getElementById('editType').value = p.type || '地块';
            document.getElementById('coordFields').style.display = 'none';
            document.getElementById('polygonAreaDisplay').style.display = 'block';
            document.getElementById('polygonAreaDisplay').textContent = p.coordinates ? `📍 坐标点数：${p.coordinates.length} | 面积：${(parseFloat(p.area)||0).toLocaleString()} ㎡` : '⚠️ 无坐标数据';
            document.getElementById('btnDelete').style.display = 'inline-flex';
            setFormDisabled(false);
            document.getElementById('modalOverlay').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            if (pendingPlotData?.layer && drawnItemsGroup?.hasLayer(pendingPlotData.layer)) drawnItemsGroup.removeLayer(pendingPlotData.layer);
            if (tempDrawnLayer && drawnItemsGroup?.hasLayer(tempDrawnLayer)) drawnItemsGroup.removeLayer(tempDrawnLayer);
            tempDrawnLayer = null; pendingPlotData = null; currentEditId = null; resetDrawToolButtons();
        }
        async function saveItem() {
            const typeFlag = document.getElementById('editTypeFlag').value;
            const idVal = document.getElementById('editId').value;
            const id = idVal ? parseInt(idVal) : null;
            const data = {
                id: id || (typeFlag==='building' ? getNextId(buildings) : getNextId(plots)),
                name: document.getElementById('editName').value.trim(),
                village: document.getElementById('editVillage').value,
                type: document.getElementById('editType').value,
                address: document.getElementById('editAddress').value.trim(),
                area: parseFloat(document.getElementById('editArea').value)||0,
                rent: parseFloat(document.getElementById('editRent').value)||0,
                status: document.getElementById('editStatus').value,
                contact: document.getElementById('editContact').value.trim(),
                phone: document.getElementById('editPhone').value.trim(),
                note: document.getElementById('editNote').value.trim()
            };
            if (typeFlag === 'building') {
                const lat = parseFloat(document.getElementById('editLat').value);
                const lng = parseFloat(document.getElementById('editLng').value);
                if (!data.name || !data.village || !data.type || !data.address || isNaN(data.area) || isNaN(data.rent) || !data.status || !data.contact || !data.phone) {
                    showToast('⚠️ 所有必填项不能为空（租金、联系人、联系电话为必填）'); return;
                }
                if (isNaN(lat)||isNaN(lng)) { showToast('⚠️ 经纬度无效'); return; }
                data.lat = lat; data.lng = lng;
                if (!id) data.createdAt = new Date().toISOString();
                if (id) { const idx = buildings.findIndex(b=>b.id===data.id); if(idx>=0){ data.createdAt = buildings[idx].createdAt; buildings[idx]=data; } }
else buildings.push(data);
await saveBuildingToDB(data);
refreshBuildingMarkers();
renderDashboard();
            } else {
                if (!data.name || !data.address) { showToast('⚠️ 名称和地址不能为空'); return; }
                if (!id && pendingPlotData?.coords) data.coordinates = pendingPlotData.coords;
                else if (id) { const p = plots.find(x=>x.id===data.id); data.coordinates = p?.coordinates || []; }
                else { showToast('⚠️ 缺少坐标数据'); return; }
                if (id) { const idx = plots.findIndex(p=>p.id===data.id); plots[idx]=data; }
                else if (!id) {
                data.createdAt = new Date().toISOString();
                plots.push(data);
                }
                await savePlotToDB(data);
                if (pendingPlotData?.layer && drawnItemsGroup?.hasLayer(pendingPlotData.layer)) drawnItemsGroup.removeLayer(pendingPlotData.layer);
                if (tempDrawnLayer && drawnItemsGroup?.hasLayer(tempDrawnLayer)) drawnItemsGroup.removeLayer(tempDrawnLayer);
                tempDrawnLayer = null; pendingPlotData = null;
                refreshPlotLayers();
            }
            closeModal(); showToast('✅ 保存成功');
        }
        function deleteCurrentItem() { const typeFlag=document.getElementById('editTypeFlag').value; const id=parseInt(document.getElementById('editId').value); if(typeFlag==='building') deleteBuildingById(id); else deletePlotById(id); closeModal(); }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
            document.querySelector(`[data-tab="${tabId}"]`)?.classList.add('active');
            document.getElementById(tabId)?.classList.add('active');
            if(tabId==='tab-map'){ if(!map1) initMap1(); else setTimeout(()=>map1.invalidateSize(),300); }
            if(tabId==='tab-plot'){ if(!map2) initMap2(); else setTimeout(()=>{ map2.invalidateSize(); refreshPlotLayers(); },300); }
            if(tabId==='tab-dashboard') renderDashboard();
        }
// ===== 实时订阅：当其他人修改数据时，自动刷新你的屏幕 =====
function startRealtimeSubscription() {
    // 订阅建筑数据变化
    const buildingChannel = supabase
        .channel('buildings-room')
        .on('postgres_changes',
            { event: '*', schema: 'public', table: 'buildings' },
            async payload => {
                console.log('收到建筑实时变更:', payload);
                const { data } = await supabase
                    .from('buildings').select('*').order('created_at', { ascending: false });
                if (data) {
                    buildings = data;
                    renderDashboard();
                    refreshBuildingMarkers();
                }
            })
        .subscribe();

    // 订阅地块数据变化
    const plotChannel = supabase
        .channel('plots-room')
        .on('postgres_changes',
            { event: '*', schema: 'public', table: 'plots' },
            async payload => {
                console.log('收到地块实时变更:', payload);
                const { data } = await supabase
                    .from('plots').select('*').order('created_at', { ascending: false });
                if (data) {
                    plots = data;
                    refreshPlotLayers();
                }
            })
        .subscribe();

    console.log('实时订阅已启动');
}
        async function init() {
            await loadData();
            document.getElementById('editVillage').innerHTML = VILLAGES_ORDER.map(v=>`<option value="${v}">${v}</option>`).join('');
            renderDashboard();
            initMap1();
            document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click', function(){ switchTab(this.dataset.tab); }));
            document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
            window.addEventListener('resize', ()=>{ map1?.invalidateSize(); map2?.invalidateSize(); });
            document.addEventListener('keydown', function(e){ if(e.key==='Escape' && document.getElementById('modalOverlay').style.display==='flex') closeModal(); });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

        window.locateBuildingOnMap = locateBuildingOnMap;
        window.viewBuilding = viewBuilding;
        window.editBuilding = editBuilding;
        window.addNewBuilding = addNewBuilding;
        window.deleteBuildingById = deleteBuildingById;
        window.flyToBuilding = flyToBuilding;
        window.editPlot = editPlot;
        window.flyToPlot = flyToPlot;
        window.deletePlotById = deletePlotById;
        window.switchTab = switchTab;
        window.closeModal = closeModal;
        window.saveItem = saveItem;
        window.deleteCurrentItem = deleteCurrentItem;
        window.activateDrawPolygon = activateDrawPolygon;
        window.activateDrawRectangle = activateDrawRectangle;
        window.cancelDrawing = cancelDrawing;
        window.clearAllPlots = clearAllPlots;
        window.filterBuildingList = filterBuildingList;
        window.filterPlotList = filterPlotList;
        window.locatePlotOnMap = flyToPlot;
    })();
</script>
</body>
</html>
